# Môi trường chạy local cho backend JP Center ERP.
# Dùng:  cd backend  →  cp .env.example .env  →  docker compose -f deploy/docker-compose.yml --env-file .env up -d
#
#   PostgreSQL  localhost:${POSTGRES_PORT}   (mặc định 5433 — tránh đụng Postgres cài sẵn trên máy ở 5432)
#   Adminer     http://localhost:8081        xem / sửa bảng trên trình duyệt (khỏi cài pgAdmin)
#   Mailpit     http://localhost:8025        hộp thư giả: xem email OTP, email mời kích hoạt
#   Seq         http://localhost:5341        xem log có cấu trúc
#   SeaweedFS   http://localhost:8333        kho file S3-compatible (thay MinIO — ADR 0003); môi trường thật dùng Cloudflare R2
name: jpcenter

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # dữ liệu giữ lại khi tắt / xóa container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:5
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP — API gửi mail vào đây
      - "8025:8025"   # giao diện web

  seq:
    image: datalust/seq:2025.2
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seqdata:/data

  # Kho file giống S3 cho local. Không khai báo tài khoản → nhận mọi access key (chỉ dùng ở máy cá nhân).
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333
    ports:
      - "8333:8333"   # S3 API — API ghi file + trình duyệt mở link tạm
    volumes:
      - seaweeddata:/data

volumes:
  pgdata:
  seqdata:
  seaweeddata:
